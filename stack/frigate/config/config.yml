mqtt:
  enabled: true
  host: 127.0.0.1

# The unauthenticated API stays on this machine. The login UI is https://<pi>:8971.
networking:
  listen:
    internal: 127.0.0.1:5000
    external: 8971

detectors:
  rknn:
    type: rknn
    num_cores: 3

model:
  path: frigate-fp16-yolov9-t
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nhwc
  labelmap_path: /labelmap/coco-80.txt
  # Our dog is white and fluffy on a light floor, and the model often reads her
  # as something else. These classes are renamed to dog, so Frigate tracks them
  # and Home Assistant sees a single "dog" count.
  labelmap:
    15: dog # cat
    18: dog # sheep
    21: dog # bear
    77: dog # teddy bear

ffmpeg:
  hwaccel_args: preset-rkmpp

go2rtc:
  streams:
    potty_cam:
      - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@{FRIGATE_TAPO_IP}:554/stream1
    potty_cam_sub:
      - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@{FRIGATE_TAPO_IP}:554/stream2

# People are tracked only so the hose never sprays someone on the patio.
objects:
  track:
    - dog
    - person
  # The dog scored 0.52 to 0.87 per frame, and visits whose running score never
  # reached the default 0.7 were missed. A missed visit costs more than a
  # question about an empty floor. People keep the default 0.7.
  filters:
    dog:
      min_score: 0.45
      threshold: 0.55

record:
  enabled: false

snapshots:
  enabled: true
  retain:
    default: 7

cameras:
  potty_cam:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/potty_cam_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      fps: 5

    # Motion keeps a potty visit open and holds the hose while anything moves.
    # Small things (bugs on the floor, a leaf) and the clock overlay don't
    # count. "Motion off" is sent 20 s after the last movement.
    motion:
      contour_area: 25
      mqtt_off_delay: 20
      mask:
        clock_overlay:
          friendly_name: Clock overlay
          coordinates: 0,0,0.37,0,0.37,0.05,0,0.05

    # No zone: the dog can use any part of the floor in view.
version: 0.18-0
